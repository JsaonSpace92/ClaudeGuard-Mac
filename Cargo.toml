[package]
name = "claude-guard"
version = "2.10.4"
edition = "2021"
description = "macOS 菜单栏出口守护器：代理出口校验、桌面应用异常关闭"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
sysinfo = "0.30"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
